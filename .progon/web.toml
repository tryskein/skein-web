schema = 1
root = ".."

[defaults]
adapter = "dotnet"
image = "mcr.microsoft.com/dotnet/sdk:10.0"
prepare_image = true
network = "grant"
nuget_cache = true
memory_mib = 4096
cpu = 2

[kind.unit]
[kind.unit.options]
project = "src/Tests/SkeinWeb.Tests.csproj"
[kind.unit.selection]
filter = "Category!=Integration"

# Session revocation through real NATS subscriptions and the shared Redis ticket store;
# the start of the application with Redis reached through Sentinel.
[kind.integ]
[kind.integ.env]
TEST_NATS_URL = "nats://nats:4222"
TEST_NATS_MONITOR_URL = "http://nats:8222/"
TEST_REDIS_URL = "redis:6379"
TEST_REDIS_SENTINEL_URL = "sentinel:26379,serviceName=skein,abortConnect=false"
[kind.integ.options]
project = "src/Tests/SkeinWeb.Tests.csproj"
[kind.integ.selection]
filter = "Category=Integration"
[[kind.integ.fixture]]
name = "nats"
image = "nats:2.10-alpine"
pull = true
cpu = 0.5
memory_mib = 128
command = ["-m", "8222"]
ready = ["wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8222/healthz"]
[[kind.integ.fixture]]
name = "redis"
image = "redis:7-alpine"
pull = true
cpu = 0.5
memory_mib = 128
command = ["redis-server", "--appendonly", "no"]
ready = ["redis-cli", "ping"]
[[kind.integ.fixture]]
# Its own primary, a Sentinel that names it (service "skein") and a replica the Sentinel
# still lists after it went down: the start of the application through Sentinel.
name = "sentinel"
image = "redis:7-alpine"
pull = true
cpu = 0.5
memory_mib = 128
command = ["sh", "-c", 'redis-server --save "" --appendonly no --dir /tmp & until redis-cli ping >/dev/null 2>&1; do sleep 0.1; done; ip=$(hostname -i | cut -d" " -f1); redis-server --port 6380 --replicaof "$ip" 6379 --replica-announce-ip "$ip" --save "" --appendonly no --dir /tmp & printf "port 26379\ndir /tmp\nsentinel monitor skein %s 6379 1\n" "$ip" > /tmp/sentinel.conf; redis-sentinel /tmp/sentinel.conf & until redis-cli -p 26379 sentinel replicas skein | grep -q 6380; do sleep 0.2; done; redis-cli -p 6380 shutdown nosave; wait']
ready = ["sh", "-c", 'redis-cli -p 26379 sentinel replicas skein | grep -q 6380 && ! redis-cli -p 6380 ping >/dev/null 2>&1']

# Stryker.NET on its default VSTest runner. On Microsoft Testing Platform its
# coverage relay goes stale after the tests that start a child SkeinWeb
# (stryker-net#3871), and every later mutant ends as a timeout. The preparation
# starts the same Redis and NATS fixtures as the integ kind and probes the tool.
[kind.mutation]
adapter = "stryker-net"
cpu = 4
memory_mib = 8192
timeout_seconds = 7200
workdir = "src/Tests"
prepare = [
  "dotnet build SkeinWeb.Tests.csproj --nologo -v q",
  # The integration run, with a machine report, before Stryker starts. The xUnit v3 test project is an
  # executable; its in-process runner writes TRX with -result-trx.
  "mkdir -p /work/results/progon && dotnet bin/Debug/net10.0/SkeinWeb.Tests.dll -trait 'Category=Integration' -noColor -result-trx /work/results/progon/integration.trx",
  "bash ../../.progon/check-integration-groups.sh /work/results/progon/integration.trx",
]
[kind.mutation.env]
TEST_NATS_URL = "nats://nats:4222"
TEST_NATS_MONITOR_URL = "http://nats:8222/"
TEST_REDIS_URL = "redis:6379"
TEST_REDIS_SENTINEL_URL = "sentinel:26379,serviceName=skein,abortConnect=false"
# Stryker.NET comes from the pinned local tool manifest (.config/dotnet-tools.json)
# through the adapter's default `dotnet tool restore` and `dotnet stryker`.
[[kind.mutation.fixture]]
name = "nats"
image = "nats:2.10-alpine"
pull = true
cpu = 0.5
memory_mib = 128
command = ["-m", "8222"]
ready = ["wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8222/healthz"]
[[kind.mutation.fixture]]
name = "redis"
image = "redis:7-alpine"
pull = true
cpu = 0.5
memory_mib = 128
command = ["redis-server", "--appendonly", "no"]
ready = ["redis-cli", "ping"]
[[kind.mutation.fixture]]
# Its own primary, a Sentinel that names it (service "skein") and a replica the Sentinel
# still lists after it went down: the start of the application through Sentinel.
name = "sentinel"
image = "redis:7-alpine"
pull = true
cpu = 0.5
memory_mib = 128
command = ["sh", "-c", 'redis-server --save "" --appendonly no --dir /tmp & until redis-cli ping >/dev/null 2>&1; do sleep 0.1; done; ip=$(hostname -i | cut -d" " -f1); redis-server --port 6380 --replicaof "$ip" 6379 --replica-announce-ip "$ip" --save "" --appendonly no --dir /tmp & printf "port 26379\ndir /tmp\nsentinel monitor skein %s 6379 1\n" "$ip" > /tmp/sentinel.conf; redis-sentinel /tmp/sentinel.conf & until redis-cli -p 26379 sentinel replicas skein | grep -q 6380; do sleep 0.2; done; redis-cli -p 6380 shutdown nosave; wait']
ready = ["sh", "-c", 'redis-cli -p 26379 sentinel replicas skein | grep -q 6380 && ! redis-cli -p 6380 ping >/dev/null 2>&1']
